name: Portfolio checks

on:
  push:
    branches:
      - linkedin-portfolio-refresh
  pull_request:
    branches:
      - main

jobs:
  content:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test tests/portfolio-content.test.mjs
